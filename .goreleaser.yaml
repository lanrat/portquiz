# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - dir: server/
    id: server
    binary: portquiz-server
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{.Version}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

  - dir: client/
    id: client
    binary: portquiz
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{.Version}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm
      - arm64
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
      - goos: darwin
        goarch: arm

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]
    allow_different_binary_count: true
    # setting files replaces the defaults, so the README is listed too
    files:
      - README*
      - LICENSE*
      # the OpenRC service is only useful next to the Linux server binary
      - src: '{{ if eq .Os "linux" }}service/*{{ end }}'

nfpms:
  # Alpine package with the server and its OpenRC service. File names have no
  # version so releases/latest/download/ links always point to the newest one.
  - id: server-apk
    ids: [server]
    package_name: portquiz-server
    file_name_template: >-
      {{ .PackageName }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else }}{{ .Arch }}{{ end }}
    formats: [apk]
    homepage: https://github.com/lanrat/portquiz
    maintainer: lanrat (https://github.com/lanrat/portquiz)
    description: Server for portquiz, answers on every TCP and UDP port to test outbound connectivity
    bindir: /usr/bin
    dependencies:
      - iptables
      - ip6tables
    contents:
      - src: service/openrc_portquiz
        dst: /etc/init.d/portquiz
        file_info:
          mode: 0755
      - src: service/openrc_portquiz.confd
        dst: /etc/conf.d/portquiz
        type: config|noreplace
        file_info:
          mode: 0644
    scripts:
      postinstall: packaging/apk/postinstall.sh
      preremove: packaging/apk/preremove.sh
    apk:
      scripts:
        postupgrade: packaging/apk/postupgrade.sh

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
