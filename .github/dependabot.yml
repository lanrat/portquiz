version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # android/gomobile uses the root module through a replace directive, so
  # both go.mod files must list the same versions of shared modules such as
  # golang.org/x/sync. One entry with one group bumps both in the same PR.
  # Most of those shared modules are indirect in android/gomobile, and
  # Dependabot only bumps direct dependencies unless told otherwise.
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/android/gomobile"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "all"
    groups:
      go-modules:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    groups:
      gradle:
        patterns:
          - "*"
