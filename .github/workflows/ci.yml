name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: make

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: check

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # tags, so the app's version comes from git describe
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'android/gomobile/go.mod'
          cache-dependency-path: |
            go.sum
            android/gomobile/go.sum

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools ndk;30.0.16248370'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test gomobile adapter
        working-directory: android/gomobile
        run: |
          go vet ./...
          go test -race ./...

      - name: Build, test and lint app
        working-directory: android
        run: ./gradlew testDebugUnitTest lint assembleDebug assembleRelease

      # the debug APK is signed with a throwaway key, so it can be installed
      # for testing; uninstall it before installing a release build
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: portquiz-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
