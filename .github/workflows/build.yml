name: goreleaser

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
            go-version-file: 'go.mod'
      
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          # 'latest', 'nightly', or a semver
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Builds the signed Android app and attaches it to the release GoReleaser
  # created. The signing key comes from the PORTQUIZ_KEYSTORE_BASE64 and
  # PORTQUIZ_KEYSTORE_PASSWORD secrets, see android/README.md.
  android:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'android/gomobile/go.mod'
          cache-dependency-path: |
            go.sum
            android/gomobile/go.sum

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools ndk;30.0.16248370'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PORTQUIZ_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The PORTQUIZ_KEYSTORE_BASE64 secret is not set, see android/README.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        working-directory: android
        env:
          PORTQUIZ_KEYSTORE: ${{ runner.temp }}/release.jks
          PORTQUIZ_KEYSTORE_PASSWORD: ${{ secrets.PORTQUIZ_KEYSTORE_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: ./gradlew assembleRelease "-PportquizVersion=$TAG"

      - name: Verify signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk portquiz_Android_arm64.apk
          sha256sum portquiz_Android_arm64.apk > portquiz_Android_arm64.apk.sha256
          gh release upload "$TAG" portquiz_Android_arm64.apk portquiz_Android_arm64.apk.sha256 --clobber
